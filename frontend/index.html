<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LadderLab – PLC Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="dashboard">
        <header class="dashboard-header">
            <h1>LadderLab – PLC Simulator</h1>
            <div class="header-right">
                <div id="estop-alert" class="estop-indicator">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.15.15 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.2.2 0 0 1-.054.06.1.1 0 0 1-.066.017H1.146a.1.1 0 0 1-.066-.017.2.2 0 0 1-.054-.06.18.18 0 0 1 .002-.183L7.884 2.073a.15.15 0 0 1 .054-.057m1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767z"/>
                        <path d="M7.002 12a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 5.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
                    </svg>
                    E‑STOP ACTIVE
                </div>
                <div class="connection-status">
                    <span class="status-dot disconnected" id="status-dot"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M15.384 6.115a.485.485 0 0 0-.047-.736A12.44 12.44 0 0 0 8 3C5.259 3 2.723 3.882.663 5.379a.485.485 0 0 0-.048.736.52.52 0 0 0 .668.05A11.45 11.45 0 0 1 8 4c2.507 0 4.827.802 6.716 2.164.205.148.49.13.668-.049"/>
                        <path d="M13.229 8.271a.482.482 0 0 0-.063-.745A9.46 9.46 0 0 0 8 6c-1.905 0-3.68.56-5.166 1.526a.48.48 0 0 0-.063.745.525.525 0 0 0 .652.065A8.46 8.46 0 0 1 8 7a8.46 8.46 0 0 1 4.576 1.336c.206.132.48.108.653-.065m-2.183 2.183c.226-.226.185-.605-.1-.75A6.5 6.5 0 0 0 8 9c-1.06 0-2.062.254-2.946.704-.285.145-.326.524-.1.75l.015.015c.16.16.407.19.611.09A5.5 5.5 0 0 1 8 10c.868 0 1.69.201 2.42.56.203.1.45.07.61-.091zM9.06 12.44c.196-.196.198-.52-.04-.66A2 2 0 0 0 8 11.5a2 2 0 0 0-1.02.28c-.238.14-.236.464-.04.66l.706.706a.5.5 0 0 0 .707 0l.707-.707z"/>
                    </svg>
                    <span id="status-text">Disconnected</span>
                </div>
            </div>
        </header>

        <div class="controls">
            <button class="control-btn" id="btn-start" onclick="pulseInput('START_BUTTON')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M10.804 8 5 4.633v6.734zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696z"/>
                </svg>
                START
            </button>
            <button class="control-btn stop-btn" id="btn-stop" onclick="pulseInput('STOP_BUTTON')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M6 3.5a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5m4 0a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5"/>
                </svg>
                STOP
            </button>
            <button class="control-btn estop-btn" id="btn-emergency" onclick="toggleEstop()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.15.15 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.2.2 0 0 1-.054.06.1.1 0 0 1-.066.017H1.146a.1.1 0 0 1-.066-.017.2.2 0 0 1-.054-.06.18.18 0 0 1 .002-.183L7.884 2.073a.15.15 0 0 1 .054-.057m1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767z"/>
                    <path d="M7.002 12a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 5.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
                </svg>
                E‑STOP
            </button>
            <button class="control-btn reset-btn" id="btn-reset" onclick="resetConveyor()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                </svg>
                RESET
            </button>
            <button class="control-btn" onclick="toggleEditor()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M10.478 1.647a.5.5 0 1 0-.956-.294l-4 13a.5.5 0 0 0 .956.294zM4.854 4.146a.5.5 0 0 1 0 .708L1.707 8l3.147 3.146a.5.5 0 0 1-.708.708l-3.5-3.5a.5.5 0 0 1 0-.708l3.5-3.5a.5.5 0 0 1 .708 0m6.292 0a.5.5 0 0 0 0 .708L14.293 8l-3.147 3.146a.5.5 0 0 0 .708.708l3.5-3.5a.5.5 0 0 0 0-.708l-3.5-3.5a.5.5 0 0 0-.708 0"/>
                </svg>
                Ladder Editor
            </button>

            <div class="program-selector">
                <select id="program-select" class="control-btn" style="padding: 0.7rem 1.2rem;">
                    <option value="">-- Select Simulation --</option>
                    <option value="example_conveyor.json">Conveyor</option>
                    <option value="example_tank.json">Tank</option>
                    <option value="example_traffic.json">Traffic Light</option>
                </select>
                <button class="control-btn" onclick="loadSelectedProgram()">Load</button>
                <input type="file" id="json-upload" accept=".json" style="display:none;" onchange="uploadProgram(event)">
                <button class="control-btn" onclick="document.getElementById('json-upload').click()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                        <path fill-rule="evenodd" d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/>
                    </svg>
                    Upload JSON
                </button>
                <button class="control-btn" onclick="saveCurrentProgram()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M2 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zm0 1h12v12H2zm2 2h8v1H4zm0 3h8v1H4zm0 3h5v1H4z"/>
                    </svg>
                    Save
                </button>
                <span style="position: relative; display: inline-block;">
                    <button class="control-btn" onclick="toggleSavedProgramsPanel()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M2 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zm0 1h12v12H2zm2 2h8v1H4zm0 3h8v1H4zm0 3h5v1H4z"/>
                        </svg>
                        Saved
                    </button>
                    <div id="saved-programs-panel" class="saved-programs-panel" style="display: none;">
                        <div class="saved-programs-header">
                            <h3>Saved Programs</h3>
                            <button class="mini-btn close-btn" onclick="toggleSavedProgramsPanel()">✕</button>
                        </div>
                        <div id="saved-programs-list" class="saved-programs-list">
                            <div class="saved-program-item">Loading...</div>
                        </div>
                    </div>
                </span>
            </div>
        </div>

        <div id="editor-panel" class="editor-panel">
            <div class="editor-header">
                <h2>⚡ Ladder Editor</h2>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="control-btn" onclick="clearAllCanvasBlocks()">Clear All</button>
                    <button class="control-btn" onclick="runProgramFromCanvasEditor()" style="border-color: var(--success); color: var(--success);">▶ Run on PLC</button>
                    <button class="control-btn" onclick="toggleEditor()">Close</button>
                </div>
            </div>

            <div class="editor-palette-floating">
                <div class="palette-item no" draggable="true" data-type="NO">NO Contact</div>
                <div class="palette-item nc" draggable="true" data-type="NC">NC Contact</div>
                <div class="palette-item coil" draggable="true" data-type="COIL">Coil</div>
                <div class="palette-item timer-item" draggable="true" data-type="TON">TON</div>
                <div class="palette-item counter-item" draggable="true" data-type="CTU">CTU</div>
            </div>

            <div class="editor-canvas-container">
                <svg id="editor-canvas-svg" width="100%" height="100%" viewBox="0 0 3000 2000" preserveAspectRatio="xMinYMin slice">
                    <defs>
                        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                            <polygon points="0 0, 8 3, 0 6" fill="#b44dff" />
                        </marker>
                    </defs>
                    <g id="canvas-wires"></g>
                    <g id="canvas-blocks"></g>
                </svg>
                <div id="zoom-indicator" class="zoom-indicator">100%</div>
            </div>
        </div>

        <div class="two-column-layout">
            <div class="left-column">
                <h2 class="section-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M6 0a.5.5 0 0 1 .5.5V3h3V.5a.5.5 0 0 1 1 0V3h1a.5.5 0 0 1 .5.5v3A3.5 3.5 0 0 1 8.5 10c-.002.434-.01.845-.04 1.22-.041.514-.126 1.003-.317 1.424a2.08 2.08 0 0 1-.97 1.028C6.725 13.9 6.169 14 5.5 14c-.998 0-1.61.33-1.974.718A1.92 1.92 0 0 0 3 16H2c0-.616.232-1.367.797-1.968C3.374 13.42 4.261 13 5.5 13c.581 0 .962-.088 1.218-.219.241-.123.4-.3.514-.55.121-.266.193-.621.23-1.09.027-.34.035-.718.037-1.141A3.5 3.5 0 0 1 4 6.5v-3a.5.5 0 0 1 .5-.5h1V.5A.5.5 0 0 1 6 0"/>
                    </svg>
                    Digital I/O
                </h2>
                <div class="legend">
                    <div class="legend-item"><span class="legend-dot"></span> Energized</div>
                    <div class="legend-item"><span class="legend-dot off"></span> De‑energized</div>
                </div>
                <div class="io-panel" id="tags-container">
                    <p style="color: var(--text-secondary);">Waiting for data...</p>
                </div>
                <h2 class="section-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M10 1.5a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5zm-5 0A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5v1A1.5 1.5 0 0 1 9.5 4h-3A1.5 1.5 0 0 1 5 2.5zm-2 0h1v1A2.5 2.5 0 0 0 6.5 5h3A2.5 2.5 0 0 0 12 2.5v-1h1a2 2 0 0 1 2 2V14a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V3.5a2 2 0 0 1 2-2"/>
                    </svg>
                    Event Log
                </h2>
                <div class="event-log" id="event-log-container">
                    <p style="color: var(--text-secondary);">No events recorded.</p>
                </div>
            </div>

            <div class="right-column" id="simulation-panel">
                <div id="sim-conveyor" class="simulation-view active">
                    <h2 class="section-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M1.5 2A1.5 1.5 0 0 0 0 3.5v2h16v-2A1.5 1.5 0 0 0 14.5 2H1.5zm0-1h13a2.5 2.5 0 0 1 2.5 2.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1-1 12.5v-9A2.5 2.5 0 0 1 1.5 1z"/>
                        </svg>
                        Conveyor Simulation
                    </h2>
                    <div class="conveyor-container">
                        <div class="conveyor-belt" id="conveyor-belt">
                            <div class="conveyor-part" id="conveyor-part"></div>
                        </div>
                        <div class="conveyor-sensor" id="conveyor-sensor">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                                <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div id="sim-tank" class="simulation-view">
                    <h2 class="section-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M13 2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM2 4v5h12V4zm0 6v2a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-2z"/>
                        </svg>
                        Tank Simulation
                    </h2>
                    <div class="tank-container">
                        <div class="tank">
                            <div class="tank-level" id="tank-level" style="height: 30%;"></div>
                        </div>
                        <div class="tank-valve" id="tank-valve"></div>
                        <div class="tank-agitator" id="tank-agitator"></div>
                    </div>
                </div>

                <div id="sim-traffic" class="simulation-view">
                    <h2 class="section-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1M2 8a6 6 0 1 1 12 0A6 6 0 0 1 2 8"/>
                            <circle cx="8" cy="5" r="1.5"/>
                            <circle cx="8" cy="8" r="1.5"/>
                            <circle cx="8" cy="11" r="1.5"/>
                        </svg>
                        Traffic Light Simulation
                    </h2>
                    <div class="traffic-light">
                        <div class="light red" id="traffic-red"></div>
                        <div class="light green" id="traffic-green"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="tag-modal">
        <div>
            <p id="tag-modal-question"></p>
            <input id="tag-modal-input" type="text" onkeydown="if(event.key==='Enter')submitTagModal()">
            <div style="display: flex; gap: 0.5rem; justify-content: center;">
                <button class="control-btn" onclick="submitTagModal()" style="border-color: var(--success); color: var(--success);">OK</button>
                <button class="control-btn" onclick="cancelTagModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
