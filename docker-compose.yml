services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./programs:/app/programs
    environment:
      - DATABASE_URL=postgresql+asyncpg://ladderlab:ladderlab@db:5432/ladderlab
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ladderlab-net

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ladderlab
      - POSTGRES_PASSWORD=ladderlab
      - POSTGRES_DB=ladderlab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ladderlab"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ladderlab-net

volumes:
  postgres_data:

networks:
  ladderlab-net:
    driver: bridge